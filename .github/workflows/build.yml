name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Extraer el proyecto Android
        run: |
          unzip -o antena-tv-apk.zip
          echo "Contenido del proyecto Android:"
          find app -maxdepth 4 -type f | sort | head -100

      - name: Configurar la dirección del sitio Antena TV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/res/values/strings.xml")
          if not p.exists():
              raise SystemExit(f"No se encontró {p}")
          content = p.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(<string\s+name=["\']app_url["\'][^>]*>).*?(</string>)',
              r'\g<1>https://antenatv.netlify.app\g<2>',
              content,
              count=1,
              flags=re.DOTALL
          )
          if count != 1:
              raise SystemExit("No se encontró el recurso app_url en strings.xml")
          p.write_text(updated, encoding="utf-8")
          print("Dirección configurada: https://antenatv.netlify.app")
          PY

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el kit de Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: latest

      - name: Instalar plataforma y herramientas de compilación
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: antena-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk antena.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk antena.apk --title "Antena TV APK" --notes "APK de Antena TV para Android."
